<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#020912">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="bf-theme.css">
<title>BusinessFlow Chefs — Service Sequence</title>
<style>
*{box-sizing:border-box}body{margin:0}.sequence-grid{display:grid;grid-template-columns:minmax(0,.78fr) minmax(0,1.22fr);gap:14px;margin-top:22px}.service-card{padding:19px;align-self:start}.service-line{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.service-line small{color:var(--bf-muted);font-size:9px;letter-spacing:.1em}.service-line h1{margin:5px 0 0;font-family:var(--bf-display);font-size:31px;font-weight:500}.time{font-size:28px;color:var(--bf-gold);font-weight:850;font-variant-numeric:tabular-nums}.status{display:inline-flex;margin-top:12px;padding:6px 10px;border-radius:999px;background:#10263a;color:#9fcfff;font-size:9px;font-weight:850}.active-dish{margin-top:15px;padding:12px;border-radius:14px;background:var(--bf-panel-2);border:1px solid var(--bf-line)}.active-dish small{display:block;color:var(--bf-gold);font-size:8px;font-weight:900;letter-spacing:.12em}.active-dish b{display:block;margin-top:5px;font-size:12px;line-height:1.4}.next{margin-top:14px;padding-top:14px;border-top:1px solid var(--bf-line);display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}.next small{color:var(--bf-gold);font-size:8px;font-weight:900;letter-spacing:.14em}.next b{display:block;margin-top:4px;font-size:13px}.clock{text-align:right;font-variant-numeric:tabular-nums;font-size:20px;font-weight:850}.section-title{display:flex;align-items:center;justify-content:space-between;margin:0 3px 10px;color:#aab7c2;font-size:9px;font-weight:900;letter-spacing:.13em}.section-title span:last-child{color:var(--bf-gold)}.steps{border:1px solid var(--bf-line);border-radius:19px;overflow:hidden;background:rgba(5,18,29,.88)}.step{display:grid;grid-template-columns:60px 30px 1fr;gap:10px;align-items:start;padding:14px 13px;border-bottom:1px solid var(--bf-line)}.step:last-child{border-bottom:0}.step time{font-size:11px;color:#a9b8c5;font-variant-numeric:tabular-nums;padding-top:5px}.dot{width:26px;height:26px;border-radius:50%;border:1px solid #425461;display:grid;place-items:center;color:#7d8c96;font-size:11px}.step b{font-size:12px;line-height:1.35}.step small{display:block;margin-top:4px;color:#8393a0;font-size:9px;line-height:1.4}.step .cue{margin-top:7px;color:#b8c7d1;font-size:9px;line-height:1.4}.step .cue strong{color:#fff}.step.done{opacity:.5}.step.done .dot{background:#285d46;border-color:#4cb681;color:#d6ffe9}.step.current{background:linear-gradient(90deg,rgba(231,182,80,.12),transparent)}.step.current .dot{border-color:var(--bf-gold);color:var(--bf-gold);box-shadow:0 0 14px rgba(231,182,80,.2)}.step.current b{color:var(--bf-gold-soft)}.controls{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px}.controls .wide{grid-column:1/-1}.footer-note{text-align:center;color:#71818e;font-size:9px;margin-top:14px;line-height:1.45}.sheet{position:fixed;inset:0;background:rgba(0,6,12,.82);display:none;align-items:flex-end;justify-content:center;padding:16px;z-index:30}.sheet.show{display:flex}.panel{width:min(100%,430px);background:linear-gradient(#0b1d2d,#06121d);border:1px solid #344754;border-radius:24px;padding:20px}.panel h2{font-family:var(--bf-display);font-weight:500;margin:0 0 14px}.panel-actions{display:flex;gap:10px;margin-top:14px}.panel-actions .bf-btn{flex:1}.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#0b1d2d;border:1px solid #3c4e5b;color:#fff;padding:10px 14px;border-radius:13px;font-size:11px;z-index:50;box-shadow:0 12px 34px rgba(0,0,0,.35)}@media(max-width:760px){.sequence-grid{grid-template-columns:1fr;margin-top:18px}.service-line h1{font-size:27px}.controls{grid-template-columns:1fr}.controls .wide{grid-column:auto}.step{grid-template-columns:52px 28px 1fr}.bf-app{max-width:430px}}
</style>
</head>
<body class="bf-screen">
<main class="bf-app">
<header class="bf-topbar"><button class="bf-round" onclick="location.href='index.html'" aria-label="Back to Home">‹</button><div class="bf-brand"><small>TODAY'S SERVICE</small><strong>Service Sequence</strong></div><button class="bf-round" onclick="openTimeSheet()" aria-label="Change service time">◷</button></header>
<div class="sequence-grid">
<section class="service-card bf-card-gold">
<div class="service-line"><div><small>ACTIVE SERVICE</small><h1 id="serviceName">Service</h1></div><div class="time" id="serviceTime">--:--</div></div>
<span class="status" id="serviceStatus">PLANNED</span>
<div class="active-dish" id="dishBox"><small>ACTIVE DISH</small><b id="dishName">No recipe loaded</b></div>
<div class="next"><div><small>NEXT ACTION</small><b id="nextTitle">Calculating…</b></div><div class="clock" id="nextClock">--:--:--</div></div>
<div class="controls"><button class="bf-btn bf-btn-secondary" onclick="openTimeSheet()" id="changeTimeBtn">Change service time</button><button class="bf-btn bf-btn-secondary" onclick="undoLast()">Undo last change</button><button class="bf-btn bf-btn-secondary wide" id="recipeBtn" onclick="openActiveRecipe()">Open active recipe</button><button class="bf-btn bf-btn-primary wide" onclick="startChefMode()">Start Chef Mode →</button></div>
<div class="footer-note">Service time, recipe instructions, countdowns and Chef Mode all read the same BusinessFlow core state.</div>
</section>
<section><div class="section-title"><span>PREP → SERVICE</span><span id="guestCount">— GUESTS</span></div><section class="steps" id="steps"></section></section>
</div>
</main>
<div class="sheet" id="timeSheet" role="dialog" aria-modal="true"><div class="panel"><h2 id="sheetTitle">Change service time</h2><input class="bf-field" id="timeInput" type="time" step="300"><div class="panel-actions"><button class="bf-btn bf-btn-secondary" onclick="closeTimeSheet()">Cancel</button><button class="bf-btn bf-btn-primary" onclick="saveServiceTime()">Update timeline</button></div></div></div>
<script src="bf-platform.js"></script><script src="bf-core.js"></script>
<script>
const core=window.BusinessFlowCore,$=id=>document.getElementById(id);const pad=n=>String(n).padStart(2,'0');
const requested=new URLSearchParams(location.search).get('service');
function resolveService(){const s=core.getState();if(requested&&s.services[requested])return requested;const next=core.getNextAction();if(next&&s.services[next.serviceId])return next.serviceId;return s.services.dinner?'dinner':Object.keys(s.services)[0];}
let serviceId=resolveService();
function formatAt(ms){const d=new Date(ms);return `${pad(d.getHours())}:${pad(d.getMinutes())}`}
function fmt(ms){ms=Math.max(0,ms);const s=Math.floor(ms/1000);return `${pad(Math.floor(s/3600))}:${pad(Math.floor((s%3600)/60))}:${pad(s%60)}`}
function toast(msg){const n=document.createElement('div');n.className='toast';n.textContent=msg;document.body.appendChild(n);setTimeout(()=>n.remove(),1700)}
function make(tag,cls,text){const el=document.createElement(tag);if(cls)el.className=cls;if(text!==undefined)el.textContent=text;return el}
function render(){const state=core.getState();if(!state.services[serviceId])serviceId=resolveService();const svc=state.services[serviceId],timeline=core.getTimeline(serviceId),now=Date.now();$('serviceName').textContent=svc.label;$('serviceTime').textContent=svc.time;$('serviceStatus').textContent=(svc.status||'planned').replace(/([A-Z])/g,' $1').trim().toUpperCase();$('guestCount').textContent=`${state.charter.guestCount} GUESTS`;$('changeTimeBtn').textContent=`Change ${svc.label.toLowerCase()} time`;$('dishName').textContent=svc.activeDishName||'No recipe loaded for this service';$('recipeBtn').disabled=!svc.activeDishId;const next=timeline.find(x=>x.status!=='done'&&x.at>=now-1000)||timeline.find(x=>x.status!=='done');$('nextTitle').textContent=next?next.label:(['served','notServed'].includes(svc.status)?'Service complete':'Ready to serve');$('nextClock').textContent=next?(next.at<=now?'DUE':fmt(next.at-now)):'--:--:--';const holder=$('steps');holder.replaceChildren();if(!timeline.length){const empty=make('div','step');empty.append(make('time','','—'),make('span','dot','·'),make('div','','No timed preparation steps loaded yet. Open a recipe and choose “Load timings into Service Sequence”.'));holder.appendChild(empty);return;}timeline.forEach(step=>{const isDone=step.status==='done',isCurrent=!isDone&&next&&step.id===next.id;const row=make('div',`step ${isDone?'done':''} ${isCurrent?'current':''}`);row.appendChild(make('time','',formatAt(step.at)));row.appendChild(make('span','dot',isDone?'✓':isCurrent?'●':'·'));const copy=make('div');copy.appendChild(make('b','',step.label));copy.appendChild(make('small','',isDone?'Completed':isCurrent?'Current / next action':'Scheduled'));if(step.instruction){const cue=make('div','cue');cue.append(document.createTextNode(step.instruction));if(step.cue){cue.appendChild(document.createElement('br'));const st=make('strong','','Correct cue: ');cue.append(st,document.createTextNode(step.cue));}copy.appendChild(cue);}row.appendChild(copy);holder.appendChild(row);});}
function openTimeSheet(){const s=core.getState(),svc=s.services[serviceId];$('timeInput').value=svc.time;$('sheetTitle').textContent=`Change ${svc.label.toLowerCase()} time`;$('timeSheet').classList.add('show')}
function closeTimeSheet(){$('timeSheet').classList.remove('show')}
function saveServiceTime(){try{core.changeServiceTime(serviceId,$('timeInput').value);closeTimeSheet();toast('Service timeline recalculated');render()}catch(e){toast(e.message||'Could not update time')}}
function undoLast(){core.undo();toast('Last change undone');render()}
function startChefMode(){location.href=`chef-mode.html?service=${encodeURIComponent(serviceId)}`}
function openActiveRecipe(){const svc=core.getState().services[serviceId];if(svc?.activeDishId)location.href=`dish-details.html?dish=${encodeURIComponent(svc.activeDishId)}`}
$('timeSheet').addEventListener('click',e=>{if(e.target.id==='timeSheet')closeTimeSheet()});core.subscribe(render);render();setInterval(render,1000);
</script>
</body></html>
