<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#020912">
<title>BusinessFlow Chefs — Home</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#020912;color:#f5f3ee;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
.home{position:relative;width:min(100vw,430px);margin:0 auto;background:#020912;overflow:hidden}.home>img{display:block;width:100%;height:auto}.hot{position:absolute;border:0;background:transparent;cursor:pointer;z-index:14}.hot:focus-visible{outline:2px solid #e7b650;border-radius:16px}
.sage{left:29%;top:23%;width:42%;height:20%}.service{left:3%;top:41%;width:94%;height:10%}.dashboard{left:4%;top:68%;width:30%;height:15%}.charters{left:35%;top:68%;width:29%;height:15%}.prov{left:65%;top:68%;width:30%;height:15%}.navdash{left:20%;top:88%;width:19%;height:8%}.navmore{left:81%;top:88%;width:18%;height:8%}
.home-side-mask{position:absolute;top:29.1%;height:11.8%;z-index:7;background:linear-gradient(180deg,rgba(2,10,18,.985),rgba(3,14,23,.985));border-radius:14px;pointer-events:none}.home-side-mask.left{left:2.4%;width:26.5%}.home-side-mask.right{right:2.4%;width:26.5%}
.home-topright-mask{position:absolute;right:2%;top:4.55%;width:19%;height:5.7%;z-index:7;background:linear-gradient(250deg,rgba(2,10,18,.99) 0%,rgba(3,13,22,.96) 74%,rgba(3,13,22,.12) 100%);border-radius:8px;pointer-events:none}.home-topright-overlay{position:absolute;right:4%;top:5.12%;z-index:15;display:flex;align-items:center;gap:8px}.bell,.avatar{width:27px;height:27px;border:0;background:transparent;color:#f2eee8;display:grid;place-items:center;cursor:pointer;padding:0}.bell{position:relative}.bell svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.bell:after{content:"";position:absolute;width:6px;height:6px;border-radius:50%;background:#e4a72e;right:1px;top:1px;box-shadow:0 0 8px rgba(228,167,46,.55)}.avatar{border:1px solid rgba(228,167,46,.78);border-radius:50%;font-size:10px;font-weight:800;background:#071521}
.next-action{position:absolute;left:4%;right:4%;top:53.2%;height:11.9%;z-index:11;border:1px solid rgba(228,167,46,.56);border-radius:12px;background:linear-gradient(145deg,rgba(7,21,33,.985),rgba(4,14,23,.985));box-shadow:0 8px 24px rgba(0,0,0,.22),inset 0 1px rgba(255,255,255,.025);padding:8px 10px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 8px;align-content:center}.next-copy{min-width:0}.next-eyebrow{display:flex;align-items:center;gap:6px;color:#e4a72e;font-size:7px;font-weight:900;letter-spacing:.13em;text-transform:uppercase}.alarm-dot{width:6px;height:6px;border-radius:50%;background:#e4a72e;box-shadow:0 0 8px rgba(228,167,46,.55)}.next-title{margin-top:4px;font-size:10px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.next-meta{margin-top:3px;color:#9eabb5;font-size:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.next-clock{text-align:right;align-self:center}.next-clock span{display:block;color:#8999a4;font-size:6px;font-weight:800;letter-spacing:.12em}.next-clock strong{display:block;margin-top:2px;font-variant-numeric:tabular-nums;font-size:20px;line-height:1;color:#f5f3ee;letter-spacing:.02em}.next-clock.due strong{color:#e4a72e}.next-actions{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:8px}.alarm-toggle{border:0;background:transparent;color:#aeb8c0;font-size:7px;padding:0;cursor:pointer}.open-sequence{border:1px solid rgba(228,167,46,.48);background:rgba(228,167,46,.08);color:#e8ba54;border-radius:999px;padding:5px 8px;font-size:7px;font-weight:800;cursor:pointer}
.sheet{position:fixed;inset:0;z-index:60;background:rgba(1,7,12,.78);display:none;align-items:flex-start;justify-content:center;padding:54px 14px 20px}.sheet.show{display:flex}.sheet-card{width:min(100%,430px);border:1px solid #314250;border-radius:18px;background:linear-gradient(#071521,#03101a);padding:18px;box-shadow:0 20px 60px rgba(0,0,0,.45)}.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:12px}.sheet h2{font-family:Georgia,serif;font-weight:500;margin:0;font-size:25px}.sheet-close{width:34px;height:34px;border-radius:50%;border:1px solid #3c4c58;background:#071521;color:#fff;font-size:20px;cursor:pointer}.notice{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:start;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.075)}.notice:last-child{border-bottom:0}.notice i{width:29px;height:29px;border-radius:50%;display:grid;place-items:center;background:#0d2030;border:1px solid #345064;font-style:normal}.notice b{font-size:10px}.notice p{margin:3px 0 0;color:#9eabb5;font-size:8px;line-height:1.4}.notice time{font-size:8px;color:#d9a446}.error-banner{display:none;position:fixed;left:10px;right:10px;bottom:10px;z-index:100;background:#351417;border:1px solid #b84b53;color:#fff;padding:10px 12px;border-radius:12px;font-size:12px}
</style>
</head>
<body>
<main class="home">
  <img src="assets/home-master.webp?v=locked3" alt="BusinessFlow Chefs approved Home design">
  <div class="home-side-mask left" aria-hidden="true"></div><div class="home-side-mask right" aria-hidden="true"></div><div class="home-topright-mask" aria-hidden="true"></div>
  <div class="home-topright-overlay"><button class="bell" aria-label="Notifications" onclick="openNotifications()"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/><path d="M10 21h4"/></svg></button><button class="avatar" aria-label="Chef profile" onclick="openProfile()">C</button></div>
  <section class="next-action" aria-label="Next action countdown"><div class="next-copy"><div class="next-eyebrow"><span class="alarm-dot"></span><span id="nextLabel">NEXT STEP</span></div><div class="next-title" id="nextTitle">Loading active service…</div><div class="next-meta" id="nextMeta"></div></div><div class="next-clock" id="nextClockBox"><span id="clockLabel">STARTS IN</span><strong id="nextClock">--:--:--</strong></div><div class="next-actions"><button class="alarm-toggle" id="alarmToggle" type="button" onclick="toggleAlarm()">🔊 Alarm ON</button><button class="open-sequence" type="button" onclick="location.href='service-sequence.html'">Service Sequence →</button></div></section>
  <button class="hot sage" aria-label="Open SAGE" onclick="alert('SAGE voice workspace is being connected to the BusinessFlow Core')"></button><button class="hot service" aria-label="Today’s Service" onclick="location.href='service-sequence.html'"></button><button class="hot dashboard" aria-label="Dashboard" onclick="alert('Dashboard remains connected to the active charter state')"></button><button class="hot charters" aria-label="Charters" onclick="location.href='journey.html'"></button><button class="hot prov" aria-label="Smart Provisioning" onclick="alert('Smart Provisioning will read the same inventory and charter state')"></button><button class="hot navdash" aria-label="Dashboard navigation" onclick="alert('Dashboard remains connected to the active charter state')"></button><button class="hot navmore" aria-label="More" onclick="alert('More menu follows after core workflow')"></button>
</main>
<div class="sheet" id="notifications" role="dialog" aria-modal="true" aria-labelledby="notificationsTitle"><div class="sheet-card"><div class="sheet-head"><h2 id="notificationsTitle">Notifications</h2><button class="sheet-close" onclick="closeNotifications()" aria-label="Close notifications">×</button></div><div id="noticeList"></div></div></div>
<div class="error-banner" id="errorBanner"></div>
<script src="bf-core.js"></script>
<script>
const BF=window.BusinessFlowCore;let firedKey='';
function fmt(ms){ms=Math.max(0,ms);const s=Math.floor(ms/1000),h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sec=s%60;return[h,m,sec].map(v=>String(v).padStart(2,'0')).join(':')}
function speak(text){if(!BF.getState().preferences.alarmEnabled||!('speechSynthesis'in window))return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='en-GB';u.rate=.97;speechSynthesis.speak(u)}catch(e){}}
function render(){try{const state=BF.getState(),action=BF.getNextAction();document.getElementById('alarmToggle').textContent=state.preferences.alarmEnabled?'🔊 Alarm ON':'🔇 Alarm OFF';if(!action){document.getElementById('nextLabel').textContent='SERVICE';document.getElementById('nextTitle').textContent='No outstanding actions';document.getElementById('nextMeta').textContent='Today’s active services are complete';document.getElementById('clockLabel').textContent='STATUS';document.getElementById('nextClock').textContent='CLEAR';return}const remaining=action.due?0:action.remainingMs;document.getElementById('nextLabel').textContent=action.due?'ACTION DUE':'NEXT STEP';document.getElementById('nextTitle').textContent=action.label;document.getElementById('nextMeta').textContent=`${action.serviceLabel} ${action.serviceTime}${action.offsetMin?` · ${action.offsetMin} min before service`:''}`;document.getElementById('clockLabel').textContent=action.due?'DUE NOW':'STARTS IN';document.getElementById('nextClock').textContent=action.due?'00:00:00':fmt(remaining);document.getElementById('nextClockBox').classList.toggle('due',action.due);const key=`${action.serviceId}|${action.id}|${action.at}`;if(action.due&&firedKey!==key){firedKey=key;speak(`Chef, ${action.label} is due now.`)}}catch(e){showError(e.message)}}
function toggleAlarm(){try{const on=!BF.getState().preferences.alarmEnabled;BF.setAlarmEnabled(on);if(on)speak('BusinessFlow preparation alarm is on.');render()}catch(e){showError(e.message)}}
function openNotifications(){renderNotifications();document.getElementById('notifications').classList.add('show')}function closeNotifications(){document.getElementById('notifications').classList.remove('show')}function openProfile(){const s=BF.getState();alert(`${s.charter.name}\n${s.charter.guestCount} guests\nStatus: ${s.charter.status}`)}
function renderNotifications(){const s=BF.getState(),a=BF.getNextAction(),list=document.getElementById('noticeList');const rows=[];if(a)rows.push(`<div class="notice"><i>⏱</i><div><b>Next action</b><p>${a.label} · ${a.due?'due now':fmt(a.remainingMs)+' remaining'}</p></div><time>LIVE</time></div>`);s.notifications.items.filter(n=>!n.read).slice(0,4).forEach(n=>rows.push(`<div class="notice"><i>•</i><div><b>${escapeHtml(n.title||'Update')}</b><p>${escapeHtml(n.message||'')}</p></div><time>NEW</time></div>`));if(!rows.length)rows.push('<div class="notice"><i>✓</i><div><b>All clear</b><p>No unread operational notifications.</p></div><time>NOW</time></div>');list.innerHTML=rows.join('')}
function escapeHtml(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function showError(m){const e=document.getElementById('errorBanner');e.textContent='BusinessFlow error: '+m;e.style.display='block'}
document.getElementById('notifications').addEventListener('click',e=>{if(e.target.id==='notifications')closeNotifications()});BF.subscribe(render);render();setInterval(render,1000);
</script>
</body>
</html>
