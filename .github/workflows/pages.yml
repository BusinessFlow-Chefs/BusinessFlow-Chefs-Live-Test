name: Deploy BusinessFlow Live Test

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build browser site
        shell: bash
        run: |
          set -e
          rm -rf site
          mkdir -p site/assets
          cp *.html style.css app.js site/
          if [ -f assets/home-master.jpg ]; then cp assets/home-master.jpg site/assets/home-master.jpg; fi
          if [ -f home.jpg.base64.txt ]; then cp home.jpg.base64.txt site/; fi

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4